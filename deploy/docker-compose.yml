services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: eca360-api
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/eca360.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-eca360admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_NAME: ECA360 Eventos
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      API_URL: ${API_URL:-http://127.0.0.1:8080}
      UPLOAD_DIR: /data/uploads
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - eca360_data:/data
    networks:
      - eca360

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Vacío = same-origin (recomendado detrás de este Nginx)
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: eca360-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - eca360

volumes:
  eca360_data:

networks:
  eca360:
    driver: bridge
